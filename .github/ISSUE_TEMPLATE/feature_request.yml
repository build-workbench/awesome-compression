name: Feature request
description: 建议新增条目或改进仓库
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: suggestion
    attributes:
      label: 建议内容
      description: 想新增的条目或改进点是什么？
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: 链接
      description: 建议条目的链接（如适用）
      placeholder: "https://github.com/..."
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: 推荐理由
      description: 为什么值得收录？
    validations:
      required: false
