name: awesome-lint

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/awesome-lint.yml'
  pull_request:
    paths:
      - 'README.md'
      - '.github/workflows/awesome-lint.yml'
  workflow_dispatch:

concurrency:
  group: awesome-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes awesome-lint
