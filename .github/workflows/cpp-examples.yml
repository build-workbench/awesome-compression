name: C++ Examples

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: cpp-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache liblzma-dev
      - name: Configure ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('examples/cpp/CMakeLists.txt', 'examples/cpp/**') }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Configure
        run: |
          cmake -S examples/cpp -B examples/cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DAWESOME_COMPRESSION_ENABLE_BSC=ON
      - name: Build
        run: cmake --build examples/cpp/build
      - name: Test
        run: ctest --test-dir examples/cpp/build --output-on-failure
      - name: Ccache stats
        run: ccache --show-stats
